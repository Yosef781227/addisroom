name: addisroom-test
services:
  addisroom-test:
    image: addisroom-test:latest
    build: .
    container_name: addisroom-test
    init: true
    restart: unless-stopped
    env_file:
      - path: ../runtime.env
        format: raw
    environment:
      DATABASE_URL: file:/data/addisroom.db
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=256
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - data:/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=33554432
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=67108864
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks: [edge]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  edge:
    external: true
    name: bingo-edge
volumes:
  data:
    name: addisroom-test-data
